name: Django CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # CI-only host port; bound to localhost by compose.yaml.
      HOST_PORT: "18080"
      # Scope every container/network/volume to this run so cleanup can only
      # ever remove resources created by this job.
      COMPOSE_PROJECT_NAME: ag-lms-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Docker and Compose versions
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build

      - name: Start service
        run: docker compose up -d

      - name: Wait for container to become healthy
        run: |
          set -euo pipefail
          container_id=$(docker compose ps -q web)
          if [ -z "$container_id" ]; then
            echo "::error::The 'web' container was not created."
            exit 1
          fi
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            state=$(docker inspect -f '{{.State.Status}}' "$container_id")
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")
            echo "state=${state} health=${health}"
            case "$state" in
              exited|dead)
                echo "::error::Container ${state} before becoming healthy."
                exit 1
                ;;
            esac
            if [ "$health" = "healthy" ]; then
              echo "Container is healthy."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 180s waiting for the container to become healthy."
              exit 1
            fi
            sleep 3
          done

      - name: Verify HTTP endpoints
        run: |
          set -uo pipefail
          for path in / /api/courses/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:${HOST_PORT}${path}" || echo "000")
            echo "GET ${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::Expected HTTP 200 from ${path}, got ${code}."
              exit 1
            fi
          done

      - name: Verify the Django process is non-root
        run: |
          set -euo pipefail
          uid=$(docker compose exec -T web sh -c 'for d in /proc/[0-9]*; do if tr "\0" " " < "$d/cmdline" 2>/dev/null | grep -q runserver; then awk "/^Uid:/ {print \$2; exit}" "$d/status"; break; fi; done')
          echo "Django runserver UID: ${uid}"
          if [ -z "$uid" ] || [ "$uid" = "0" ]; then
            echo "::error::Expected the Django process to run as a non-root user."
            exit 1
          fi

      - name: Verify container resource limits
        run: |
          set -euo pipefail
          container_id=$(docker compose ps -q web)
          mem=$(docker inspect -f '{{.HostConfig.Memory}}' "$container_id")
          cpus=$(docker inspect -f '{{.HostConfig.NanoCpus}}' "$container_id")
          pids=$(docker inspect -f '{{.HostConfig.PidsLimit}}' "$container_id")
          echo "memory=${mem} nanocpus=${cpus} pids=${pids}"
          if [ "$mem" != "268435456" ]; then
            echo "::error::Expected mem_limit 268435456 (256m), got ${mem}."
            exit 1
          fi
          if [ "$cpus" != "500000000" ]; then
            echo "::error::Expected cpus 500000000 (0.50), got ${cpus}."
            exit 1
          fi
          if [ "$pids" != "128" ]; then
            echo "::error::Expected pids_limit 128, got ${pids}."
            exit 1
          fi

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "== docker compose ps -a =="
          docker compose ps -a || true
          container_id=$(docker compose ps -q web || true)
          if [ -n "$container_id" ]; then
            echo "== health =="
            docker inspect -f 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" || true
          fi
          echo "== recent logs (redacted) =="
          docker compose logs --tail=60 2>&1 \
            | sed -E 's/([A-Za-z0-9_]*([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn])[A-Za-z0-9_]*)[=:][[:space:]]*[^[:space:]]+/\1=***/g' \
            || true

      - name: Clean up CI Compose resources
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans --timeout 30 || true
