services:
  web:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    # Restart crashed containers up to 5 times. This suits a local demo: it
    # recovers from an unexpected crash without looping forever on a
    # persistent misconfiguration. Note a healthcheck does NOT trigger a
    # restart by itself; this policy reacts to process exit, not health.
    restart: "on-failure:5"
    # A tiny init (tini) as PID 1 reaps zombies and forwards signals so the
    # stop signal reaches the unprivileged Django process for a clean shutdown.
    init: true
    # Give the dev server time to finish in-flight SQLite writes on stop
    # before Docker escalates to SIGKILL.
    stop_grace_period: 30s
    # Liveness/readiness probe using only the Python standard library (no curl
    # or wget). urlopen raises on connection errors and non-2xx responses, so
    # the command exits non-zero when Django is not serving.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Conservative limits for a single-process local demo. They cap a runaway
    # process without starving normal Django/SQLite startup and seeding.
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    # Bound the json-file log growth so a long-running demo cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # DEBUG defaults to false. For local development set DJANGO_DEBUG=true
      # (for example in .env or on the command line).
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_PATH: /app/data/db.sqlite3
      # Generated once and persisted on the demo_data volume; never committed.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SECRET_KEY_FILE: /app/data/django_secret_key
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-demo-admin-pass}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-demo-teacher-pass}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-demo-student-pass}
    volumes:
      - demo_data:/app/data
    # Run the application as an unprivileged user with least privilege. The
    # entrypoint needs CHOWN/SETUID/SETGID only to fix volume ownership and drop
    # privileges on startup; the Django process itself runs without them.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000 --insecure --noreload"
volumes:
  demo_data:
